description: >-
  Contensis publishes a pricing page and no prices. This file replaces a 2026-05-04
  scaffold that invented three tiers (Free / Professional / Enterprise) with request quotas
  and rate limits Contensis has never published. None of that was real and it has been
  removed rather than left to be read as fact.
plan_count: 0
