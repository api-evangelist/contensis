finding: >-
  https://www.contensis.com/pricing returned HTTP 200 and is a genuine pricing page — it
  carries the heading "Contensis DXP Pricing", the line "Choose a pricing level that suits
  your current expectations", and two tab labels, "CMS licence and features" and
  "Extensions and upgrades". It names no tier, no price, no currency and no included
  volume. The only call to action is "Speak to us". There is no self-service signup and no
  published API pricing of any kind — no per-request price, no quota, no overage rate.
evidence:
  - url: https://www.contensis.com/pricing
    status: 200
    note: >-
      Live pricing page. Tier detail is loaded dynamically and no tier names or prices are
      present in the served document.
  - url: https://www.contensis.com/plans-and-pricing
    status: 404
related:
  - >-
    Zengenti publishes commercial terms it does not publish on contensis.com through the UK
    Government G-Cloud Digital Marketplace, where each Contensis service definition carries
    pricing documents and an SLA. That is a procurement channel, not a public price list.
  - >-
    Licence tier does affect the SLA — Contensis states uptime of 99.9% to 99.99%
    "depending on the licence type" — so tiers exist commercially even though none are
    named publicly. See lifecycle/contensis-lifecycle.yml.
