  - url: https://www.contensis.com/help-and-docs/apis/image-api
    type: Documentation
  - url: https://www.contensis.com/community/blog/developing-with-the-contensis-image-api
    type: Blog
  description: >-
    The Contensis Image API provides real-time image manipulation and optimization features as part of
    the Delivery API. It supports on-the-fly transformations such as resizing, cropping, format conversion,
    and quality adjustment via URL query parameters, and is designed to speed up image delivery for responsive,
    multi-device experiences.
