    version: 15.1.0
    published: '2021-09-29'
    url: https://www.nuget.org/packages/Zengenti.Contensis.Delivery.RazorPages.NodeRouteHandling
    description: >-
      ASP.NET Razor Pages node route-handling middleware. Last published 2021 and pinned to
      the 15.x CMS line — five product majors behind the 17.2 clients above; treat as
      legacy rather than current.
