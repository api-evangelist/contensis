specification: API Commons Packages
specificationVersion: '0.1'
provider: Contensis
providerId: contensis
generated: '2026-09-06'
method: searched
source: >-
  npm registry metadata (registry.npmjs.org), the NuGet v3 registration index
  (api.nuget.org), the Chocolatey community feed, and the provider's own GitHub
  organisation (https://github.com/contensis). Every package below is published by
  Contensis / Zengenti Ltd and links back to a repository in that org, so all are
  first-party. Versions and dates are read from registry metadata, not from prose.
description: >-
  First-party client libraries and tooling for the Contensis Delivery, Management and
  Image APIs. Contensis ships two complete language stacks — JavaScript/TypeScript on npm
  and .NET on NuGet — plus a React framework, a Canvas rendering family, a forms renderer,
  a personalisation engine, an importer and a CLI. The .NET clients track the CMS product
  version (17.2.0), which makes them the clearest currency signal in this record.
tags:
  - SDK
  - Client Library
  - Headless CMS
  - npm
  - NuGet
packages:
  # ---- Core API clients ----
  - name: contensis-delivery-api
    registry: npm
    official: true
    language: JavaScript/TypeScript
    version: 1.6.2
    published: '2026-02-10'
    url: https://www.npmjs.com/package/contensis-delivery-api
    repository: https://github.com/contensis/contensis-delivery-api
    api: Contensis Delivery API
    description: Client for retrieving content using the read-only Contensis Delivery API.
  - name: contensis-management-api
    registry: npm
    official: true
    language: JavaScript/TypeScript
    version: 2.4.0
    published: '2025-06-10'
    url: https://www.npmjs.com/package/contensis-management-api
    repository: https://github.com/contensis/contensis-management-api
    api: Contensis Management API
    description: Client for managing content using the Contensis Management API.
  - name: contensis-core-api
    registry: npm
    official: true
    language: JavaScript/TypeScript
    version: 1.2.2
    published: '2026-02-10'
    url: https://www.npmjs.com/package/contensis-core-api
    repository: https://github.com/contensis/contensis-core-api
    description: >-
      Shared dependency library used by contensis-delivery-api and contensis-management-api.
  - name: Zengenti.Contensis.Delivery
    registry: nuget
    official: true
    language: .NET
    version: 17.2.0
    published: '2026-03-31'
    url: https://www.nuget.org/packages/Zengenti.Contensis.Delivery
    api: Contensis Delivery API
    description: >-
      .NET client library for retrieving content from the Contensis Delivery API. Version
