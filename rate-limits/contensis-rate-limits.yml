specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Contensis
providerId: contensis
created: '2026-05-04'
modified: '2026-09-06'
generated: '2026-09-06'
method: searched
source: >-
  The full Contensis HTTP API reference at https://www.contensis.com/help-and-docs/apis,
  read through the provider's own markdown mirror
  https://github.com/contensis/contensis-docs (922 files, searched for "rate limit",
  "throttle", "429", "X-RateLimit" and "Retry-After" — zero matches).
description: >-
  Contensis documents no rate limits. This file replaces a 2026-05-04 scaffold that
  invented per-tier quotas (10/100/1000 requests per minute, 1k/100k monthly) and a full
  set of X-RateLimit-* response headers. Contensis publishes none of that. The invented
  values have been removed.
limit_count: 0
limits: []
headers:
  limit: null
  remaining: null
  reset: null
  retryAfter: null
  policy: null
  note: >-
    No rate-limit response headers are documented anywhere in the API reference. An agent
    has no runtime signal to pace itself against.
responseCodes:
  throttled: null
  note: >-
    No 429 appears in any documented Responses table. The published status codes across the
    Delivery and Management reference are 200, 201, 204, 400, 401, 404 and 500. See
    errors/contensis-problem-types.yml.
finding: >-
  Zero published limits and zero throttling signal. This is not the same as "no limits" —
  Contensis is a per-tenant hosted platform and almost certainly enforces something at the
  infrastructure layer — but nothing is stated, so a client cannot size a batch, cannot
  distinguish throttling from failure, and has no documented backoff contract. The one
  place Contensis does publish retry semantics is in the opposite direction: outbound
  webhooks retry nine times over 24 hours with exponential backoff after a 10-second
  timeout (asyncapi/contensis-webhooks.yml). Inbound has no equivalent.
evidence:
  - url: https://www.contensis.com/help-and-docs/apis
    status: 200
  - url: https://github.com/contensis/contensis-docs
    status: 200
    note: >-
      Provider-published markdown mirror of the documentation. Searched in full; no rate
      limit, throttling, 429 or Retry-After content exists.
policies: []
